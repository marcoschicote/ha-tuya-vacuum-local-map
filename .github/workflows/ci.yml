name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the privacy check reads every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: git config user.email noreply@github.com
      - run: python tools/check_private.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The HACS action refuses private repositories ("can only validate public
    # repositories"), so this job is skipped while a repo is private. It runs now that
    # this one is public; the guard stays so a private fork's CI doesn't fail on it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
