[project]
name = "ha-tuya-vacuum-local-map"
version = "0.0.0"
description = "Local coverage map for Tuya robot vacuums in Home Assistant"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruff>=0.6",
    "tinytuya>=1.20.0,<2",
    "pytest-homeassistant-custom-component",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
